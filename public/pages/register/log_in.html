<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login Page</title><link rel="stylesheet" href="/style.css"><script src="https://kit.fontawesome.com/ef8f49099c.js" crossorigin="anonymous"></script></head><body data-page="login"><main class="centerbody" style="background-image:url('/images/glasses3.jpg');background-repeat:no-repeat;background-size:cover;background-position:center"><section class="login-row"><div class="flex-container-login"><form class="flex-form-login" id="formLogin"><h3>Log in!</h3><div class="input-control"><label for="emailLogin"><b>Email</b></label><input id="emailLogin" name="emailLogin" type="text"><div class="error"></div></div><div class="input-control"><label for="passLogin"><b>Password</b></label><input id="passLogin" name="passLogin" type="password"><div class="error"></div></div><div class="btn-container"><button class="btn" type="submit">Submit</button><button class="icon-button-admin" id="clear" type="reset"><i class="fa-solid fa-eraser"></i></button></div><span class="error"></span></form></div></section></main><script src="/js/api.js"></script><script src="/js/site.js"></script><script src="/js/pages.js"></script></body></html>
