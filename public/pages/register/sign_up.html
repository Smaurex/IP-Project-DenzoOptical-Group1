<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up Page</title><link rel="stylesheet" href="/style.css"><script src="https://kit.fontawesome.com/ef8f49099c.js" crossorigin="anonymous"></script></head><body data-page="signup"><main class="centerbody"><section class="signup-row"><div class="flex-container" style="background-image:linear-gradient(to bottom left,#AC1754,#E53888)"><div id="img_signup"><img src="/images/optical_2.png" alt="Optical" style="width:100%;height:100%;object-fit:cover;opacity:.5"><p>"Love your eyes!"</p></div></div><div class="flex-container"><form class="flex-form" id="formSignup"><h3>Sign up!</h3><div class="input-control"><label for="fname"><b>First Name</b></label><input id="fname" name="fname" type="text"><div class="error"></div></div><div class="input-control"><label for="lname"><b>Last Name</b></label><input id="lname" name="lname" type="text"><div class="error"></div></div><div class="input-control"><label for="email"><b>Email</b></label><input id="email" name="email" type="text"><div class="error"></div></div><div class="input-control"><label for="pass"><b>Password</b></label><input id="pass" name="pass" type="password"><div class="error"></div></div><div class="input-control"><label for="passConf"><b>Confirm Password</b></label><input id="passConf" name="passConf" type="password"><div class="error"></div></div><div class="btn-container"><button class="btn" type="submit">Submit</button><button class="icon-button-admin" type="reset"><i class="fa-solid fa-eraser"></i></button></div><span class="error"></span></form></div></section></main><script src="/js/api.js"></script><script src="/js/site.js"></script><script src="/js/pages.js"></script></body></html>
